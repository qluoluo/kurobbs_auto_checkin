name: Auto Checkin Job

on:
  schedule:
    # 每天早上 6 点北京时间（UTC+8）运行
    - cron: '0 22 * * *'  # UTC 时间 22:00 对应北京时间 6:00
  workflow_dispatch:  # 允许手动触发

jobs:
  auto-sign:
    runs-on: ubuntu-latest  # 使用最新的 Ubuntu 环境

    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. 设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'  # 指定 Python 版本

      # 3. 安装依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt  # 如果有依赖文件

      # 4. 运行脚本并捕获输出
      # 注意: 不要加 continue-on-error, 否则脚本失败时 run 仍显示成功, GitHub 不会发失败通知
      - name: Run auto checkin script
        id: run_script  # 给步骤命名，方便后续引用输出
        env:
          TOKEN: ${{ secrets.TOKEN }}
          DEBUG: ${{ secrets.DEBUG }}
          BARK_DEVICE_KEY: ${{ secrets.BARK_DEVICE_KEY }}
          BARK_SERVER_URL: ${{ secrets.BARK_SERVER_URL }}
          SERVER3_SEND_KEY: ${{ secrets.SERVER3_SEND_KEY }} # ServerChan3
        run: |
          python auto_checkin.py

      # 5. 签到失败时发送邮件通知(QQ邮箱 SMTP)
      - name: Send failure mail
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.qq.com
          server_port: 465
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          secure: true
          subject: 库街区自动签到失败 ❌
          to: ${{ secrets.MAIL_TO }}
          from: 库街区签到 <${{ secrets.SMTP_USER }}>
          priority: high
          body: |
            库街区自动签到任务失败了，请尽快处理！

            常见原因:
            1. TOKEN 过期: 到仓库 Settings → Secrets and variables → Actions 更新 TOKEN
            2. 接口变动或风控: 查看运行日志确认

            运行日志: https://github.com/qluoluo/kurobbs_auto_checkin/actions
